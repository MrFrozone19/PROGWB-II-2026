<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restablecer contraseña — Enlace B2B Local</title><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/real.css"><link rel="icon" href="../assets/favicon.svg"><script src="../js/api.js"></script></head><body><main class="real" style="max-width:660px;margin:70px auto"><h2>Nueva contraseña</h2><section class="real-panel"><p>El enlace es personal y vence en 30 minutos.</p><form id="f"><label>Contraseña nueva<input type="password" name="nueva" minlength="8" required></label><button>Guardar contraseña</button></form><p id="mensaje" role="status"></p><a href="01-inicio-sesion.html">Volver al inicio de sesión</a></section></main><script>
const f=document.getElementById('f'),params=new URLSearchParams(location.search);
f.addEventListener('submit',async e=>{e.preventDefault();const b=f.querySelector('button');b.disabled=true;try {const r=await solicitarApi('/auth/restablecer',{method:'POST',body:JSON.stringify({correo:params.get('correo'),token:params.get('token'),nueva:f.elements.nueva.value})});document.getElementById('mensaje').textContent=r.mensaje;f.hidden=true}catch(err){document.getElementById('mensaje').textContent=err.message}finally{b.disabled=false}});
</script></body></html>
